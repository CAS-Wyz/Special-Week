# Configuration du serveur
server.port=8080

# Nom de l'application
spring.application.name=ia-fakenews-api

# Autoriser les requêtes depuis ton frontend (CORS)
# Remplace localhost:5500 par l'URL de ton frontend
spring.web.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500

# Chemin vers les fichiers JSON de données
app.data.path=classpath:data/

# Logs pour le debug (optionnel)
logging.level.com.fakenews=DEBUG
