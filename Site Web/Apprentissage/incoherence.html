<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incohérence</title>
    <link rel="stylesheet" href="apprentissage.css">
    <link rel="icon" type="image/png" href="../src/Logo Special Week.png">
</head>
<body>
    <main class="game-wrapper">
        <div class="game-header">
            <a href="apprentissage.html" class="back-link">← Retour aux jeux</a>
            <h1>Trouve l'incohérence !</h1>
            <div id="progress-bar">Question <span id="current-q">1</span>/6</div>
        </div>

        <div class="card-container" style="max-width: 800px;"> <div id="image-display" class="challenge-box">
                </div>

            <div id="options-grid" class="options-grid" style="margin-top: 20px;">
                </div>

            <div style="text-align: center; margin-top: 20px;">
                <button id="valider-btn" class="next-btn" onclick="checkAnswer()">Valider mes choix</button>
            </div>

            <div id="feedback" class="hidden" style="text-align: center; margin-top: 20px; padding: 15px; border-radius: 8px;">
                <p id="feedback-text" style="margin-bottom: 15px; font-size: 1.1em;"></p>
                <button id="next-btn" onclick="nextQuestion()" class="next-btn">Question suivante</button>
            </div>
        </div>
        <div id="image-modal" class="hidden" onclick="closeModal()">
    <img id="modal-img" src="" alt="Image en grand">
</div>
    </main>

    <script src="../header.js"></script>
  <script src="../pseudo.js"></script>
    <script src="incoherence.js"></script>
    <script src="../footer.js"></script>
</body>
</html>
