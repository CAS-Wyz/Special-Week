<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IA — Clairvo'lAnce</title>
  <link rel="stylesheet" href="fakebot.css">
  <link rel="icon" type="image/png" href="../src/Logo Special Week.png">
</head>
<body>

  <script src="../header.js"></script>

  <main>
    <div class="chat" role="region" aria-label="FakeBot Chat">
      <!-- Bandeau supérieur -->
      <div class="topbar">
        <div class="header-line">
          <div class="dot" aria-hidden="true"></div>
          <div>
            <h1>FAKEBOT_v1.0</h1>
            <div class="subtitle">Quiz Vrai/Faux : réponds et lis l’explication !</div>
          </div>
        </div>
      </div>

      <!-- Messages -->
      <div id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>

      <!-- Carte statut (score / état) -->
      <div class="status" id="status"></div>

      <!-- Entrée utilisateur -->
      <form id="chat-form">
        <textarea id="input" placeholder="Réponds « Vrai » ou « Faux »…" required aria-label="Votre réponse"></textarea>
        <button class="btn-primary" type="submit">Envoyer</button>
      </form>
    </div>
  </main>

  <script src="../footer.js"></script>
  <script src="fakebot.js"></script>
</body>
</html>
